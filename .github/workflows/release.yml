name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  panel-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  site-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
        with:
          # Site template needs its own lockfile context
          lfs: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: templates/emdash-node
          push: true
          build-args: EMDASH_DB=${{ matrix.engine }}
          tags: |
            ghcr.io/${{ github.repository }}/emdash-site-${{ matrix.engine }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/emdash-site-${{ matrix.engine }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
